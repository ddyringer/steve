# Just to be backwards compatible with previous versions, this is set to "steve",
# since there might be already configured chargepoints expecting the older path.
# Otherwise, might as well be changed to something else or be left empty.
#
context.path =

# Database configuration
#
db.ip = localhost
db.port = 3306
db.schema = stevedb
db.user = steve
db.password = changeme

# Credentials for Web interface access
#
auth.user = admin
auth.password = 1234

# The header key and value for Web API access using API key authorization.
# Both must be set for Web APIs to be enabled. Otherwise, we will block all calls.
#
webapi.key = STEVE-API-KEY
webapi.value =

# Jetty configuration
#
server.host = 127.0.0.1
server.gzip.enabled = false

# Jetty HTTP configuration
#
http.enabled = true
http.port = 8080

# Jetty HTTPS configuration
#
https.enabled = false
https.port = 8443
keystore.path =
keystore.password =

# When the WebSocket/Json charge point opens more than one WebSocket connection,
# we need a mechanism/strategy to select one of them for outgoing requests.
# For allowed values see de.rwth.idsg.steve.ocpp.ws.custom.WsSessionSelectStrategyEnum.
#
ws.session.select.strategy = ALWAYS_LAST

# if BootNotification messages arrive (SOAP) or WebSocket connection attempts are made (JSON) from unknown charging
# stations, we reject these charging stations, because stations with these chargeBoxIds were NOT inserted into database
# beforehand. by setting this property to true, this behaviour can be modified to automatically insert unknown
# stations into database and accept their requests.
#
# CAUTION: setting this property to true is very dangerous, because we will accept EVERY BootNotification or WebSocket
# connection attempt from ANY sender as long as the sender knows the URL and sends a valid message.
#
auto.register.unknown.stations = true

# if this field is set, it will take precedence over the default regex we are using in
# de.rwth.idsg.steve.web.validation.ChargeBoxIdValidator.REGEX to validate the format of the chargeBoxId values
#
# e_charger: chargeBoxId = factory serial number YY-WW-jjjjj-ddddd (year, week, jig, device).
# Only stations matching this pattern can connect (and be auto-registered).
#
charge-box-id.validation.regex = ^[0-9]{2}-[0-9]{2}-[0-9]{5}-[0-9]{5}$

# e_charger: free vending. On startup, the idTag below is created/updated in DB with unlimited concurrent transactions.
# On every accepted BootNotification, stations get Cst_FreeVendActive=true and Cst_FreeVendIdTag=<id-tag>.
#
e-charger.free-vend.enabled = true
e-charger.free-vend.id-tag = A0000000

# e_charger: provisioning pushed to every station after each accepted BootNotification.
#   delay                 - wait before sending, so the station has processed the BootNotification response
#   change-configuration  - comma-separated KEY=VALUE list, each sent as one ChangeConfiguration
#   charging-profile-pk   - pk of the 10 A ChargePointMaxProfile in Data Management > Charging Profiles,
#                           sent as SetChargingProfile on connector 0. Leave empty to skip.
#
e-charger.boot.delay = 10s
e-charger.boot.change-configuration =
e-charger.boot.charging-profile-pk = 1

### DO NOT MODIFY ###
db.sql.logging = true
profile = dev
